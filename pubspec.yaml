name: zero_waste_chef
description: "A smart Zero Waste Chef application with AI recipes"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.5
  firebase_core: 
  cloud_firestore: 
  firebase_auth: 
  google_sign_in: ^6.2.1
  logger: 

  # Пакеты для локализации (на одном уровне с остальными!)
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: 
  firebase_auth_mocks: 

flutter:
  uses-material-design: true
  generate: true # Разрешаем автогенерацию локализации
